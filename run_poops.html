<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
  :root { --bg:#070b1d; --panel:rgba(16,24,58,.82); --line:rgba(93,151,255,.28); --text:#edf4ff; --cyan:#48caff; --violet:#8b6cff; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; background:radial-gradient(circle at 18% -15%,#203f8f 0,transparent 38%),radial-gradient(circle at 100% 100%,#45277b 0,transparent 42%),var(--bg); color:var(--text); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  #brand { display:flex; align-items:center; justify-content:center; gap:10px; min-height:66px; padding:11px 18px; background:rgba(7,11,29,.76); border-bottom:1px solid var(--line); box-shadow:0 8px 28px rgba(0,0,0,.25); backdrop-filter:blur(12px); }
  #brand img { width:38px; height:38px; border-radius:50%; filter:drop-shadow(0 0 9px rgba(72,202,255,.55)); }
  #brand b { color:#fff; font-size:17px; font-weight:800; letter-spacing:.18em; text-shadow:0 0 18px rgba(72,202,255,.45); }
  #wrap { max-width:900px; margin:28px auto; padding:24px; }
  #state { margin:0 0 13px; font-size:24px; font-weight:800; letter-spacing:.02em; }
  #out { height:calc(100vh - 176px); min-height:280px; overflow-y:auto; padding:15px; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05); color:#cddcff; font:12px/1.55 Consolas,"Courier New",monospace; }
  .ok { color:#65e8b8; } .bad { color:#ff8398; } .warn { color:#ffd16e; }
</style>
</head>
<body>
<div id="brand"><img src="logo_playzone.png" alt="" width="28" height="28"><b>PLAYZONE</b></div>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
